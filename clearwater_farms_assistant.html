<!DOCTYPE html>

<head>

<title>Clearwater Farms Assistant</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f7f9fc; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }
.header { background: #1B3A6B; padding: 16px 20px 12px; text-align: center; border-bottom: 3px solid #4A7BC4; flex-shrink: 0; }
.header img { height: 80px; display: block; margin: 0 auto 8px; border-radius: 8px; }
.header p { font-size: 13px; color: #a8c4e8; }
.chips-wrap { background: white; border-bottom: 1px solid #C8D8EE; padding: 10px 12px; flex-shrink: 0; }
.chips-label { font-size: 11px; font-weight: 600; color: #8a9ab0; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 7px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: #EBF2FB; border: 1px solid #C8D8EE; border-radius: 14px; padding: 5px 11px; font-size: 13px; color: #1B3A6B; cursor: pointer; font-weight: 500; }
#messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
.msg { display: flex; gap: 8px; align-items: flex-end; }
.msg.user { flex-direction: row-reverse; }
.av { width: 30px; height: 30px; border-radius: 50%; background: #1B3A6B; color: white; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.msg.user .av { background: #2A5298; }
.bub { max-width: calc(100% - 46px); padding: 9px 13px; border-radius: 14px; font-size: 15px; line-height: 1.5; }
.msg.ai .bub { background: white; border: 1px solid #C8D8EE; border-bottom-left-radius: 3px; }
.msg.user .bub { background: #1B3A6B; color: white; border-bottom-right-radius: 3px; }
.bub p { margin-bottom: 6px; } .bub p:last-child { margin-bottom: 0; }
.bub ul { padding-left: 16px; margin-bottom: 6px; } .bub li { margin-bottom: 2px; } .bub b { font-weight: 600; }
.dots { display: flex; gap: 4px; padding: 10px 4px; align-items: center; }
.dots span { width: 7px; height: 7px; background: #4A7BC4; border-radius: 50%; animation: bounce 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: 0.2s; } .dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
.errmsg { color: #c0392b; font-size: 13px; }
#bar { background: white; border-top: 1px solid #C8D8EE; padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; }
#inp { flex: 1; border: 1.5px solid #C8D8EE; border-radius: 18px; padding: 9px 13px; font-size: 15px; font-family: inherit; outline: none; resize: none; max-height: 110px; line-height: 1.4; background: #EBF2FB; color: #1a1a1a; }
#inp:focus { border-color: #1B3A6B; background: white; } #inp::placeholder { color: #8a9ab0; }
#btn { width: 40px; height: 40px; background: #1B3A6B; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }
#btn:disabled { background: #ccc; } #btn svg { width: 17px; height: 17px; fill: white; }
.foot { text-align: center; font-size: 11px; color: #aaa; padding: 6px; background: #f7f9fc; flex-shrink: 0; }
</style>
