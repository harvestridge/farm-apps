<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Clearwater Farms Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy:       #1B3A6B;
    --navy-mid:   #2A5298;
    --navy-light: #4A7BC4;
    --blue-pale:  #EBF2FB;
    --border:     #C8D8EE;
    --cream:      #F7F9FC;
    --text:       #1a1a1a;
    --text-muted: #8a9ab0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .app-header {
    background: var(--navy);
    padding: 18px 20px 14px;
    text-align: center;
    flex-shrink: 0;
    border-bottom: 3px solid var(--navy-light);
  }
  .app-header img {
    height: 72px;
    width: auto;
    display: block;
    margin: 0 auto 10px;
    filter: brightness(0) invert(1);
  }
  .app-header p { font-size: 13px; color: #a8c4e8; letter-spacing: 0.04em; }
  .chips-section {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 10px 12px;
    flex-shrink: 0;
  }
  .chips-label {
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    background: var(--blue-pale); border: 1px solid var(--border);
    border-radius: 16px; padding: 5px 12px; font-size: 13px;
    color: var(--navy); cursor: pointer; font-weight: 500;
    -webkit-tap-highlight-color: transparent;
  }
  .chip:active { background: var(--navy); color: white; border-color: var(--navy); }
  #chat-scroll {
    flex: 1; overflow-y: auto; padding: 14px 12px;
    display: flex; flex-direction: column; gap: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .msg { display: flex; gap: 8px; align-items: flex-end; animation: fadeUp 0.2s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: white; flex-shrink: 0;
    letter-spacing: 0;
  }
  .avatar.ai  { background: var(--navy); }
  .avatar.usr { background: var(--navy-mid); }
  .bubble {
    max-width: calc(100% - 50px);
    padding: 10px 14px; border-radius: 16px;
    font-size: 15px; line-height: 1.55;
  }
  .msg.ai .bubble {
    background: white; border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.user .bubble {
    background: var(--navy); color: white;
    border-bottom-right-radius: 4px;
  }
  .bubble p { margin-bottom: 7px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul { padding-left: 18px; margin-bottom: 7px; }
  .bubble li { margin-bottom: 3px; }
  .bubble strong { font-weight: 600; }
  .typing { display: flex; gap: 5px; padding: 14px 16px; align-items: center; }
  .typing span {
    width: 8px; height: 8px; background: var(--navy-light);
    border-radius: 50%; animation: dot 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-7px); }
  }
  #input-bar {
    background: white; border-top: 1px solid var(--border);
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    flex-shrink: 0; display: flex; gap: 8px; align-items: flex-end;
  }
  #user-input {
    flex: 1; border: 1.5px solid var(--border); border-radius: 20px;
    padding: 9px 14px; font-size: 15px; font-family: inherit;
    outline: none; resize: none; max-height: 120px; line-height: 1.4;
    background: var(--blue-pale); color: var(--text);
  }
  #user-input:focus { border-color: var(--navy); background: white; }
  #user-input::placeholder { color: var(--text-muted); }
  #send-btn {
    width: 42px; height: 42px; background: var(--navy);
    border: none; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; -webkit-tap-highlight-color: transparent;
  }
  #send-btn:disabled { background: #bbb; }
  #send-btn svg { width: 18px; height: 18px; fill: white; }
  .app-footer {
    text-align: center; font-size: 12px; color: var(--text-muted);
    padding: 8px; background: var(--cream); flex-shrink: 0;
  }
</style>
</head>

  <textarea id="user-input" rows="1"
    placeholder="Ask about organic farming, equipment, agronomy..."
    onkeydown="handleKey(event)"
    oninput="autoResize(this)"></textarea>
  <button id="send-btn" onclick="sendMessage()">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<div class="app-footer">Clearwater Farms &middot; Est. 2000 &middot; Caro, MI &middot; Powered by Claude AI</div>

<script>
var SYSTEM = "You are the Clearwater Farms Assistant, a knowledgeable AI for Clearwater Farms (CWF), an organic grain and row crop operation in Caro, Michigan in the Thumb region. Established in 2000. Run by Jon and his farm crew. Certified organic. Crops: dry beans, soybeans, yellow corn, blue corn, spelt, wheat, rye. Primarily John Deere equipment including a Treffler 45-foot tine weeder. Your expertise: organic agronomy, crop rotation, mechanical weed control, cover cropping, organic fertility management, dry bean production, soybean and corn and small grain production, soil health, pest and disease management in organic systems, John Deere diagnostics including AutoTrac and GPS and 9RX, organic certification NOP rules and record keeping, Michigan Thumb weather and planting windows. Be practical, specific, and concise. Speak like a trusted agronomist who knows the Thumb region well. Do NOT discuss grain processing, food safety, or packaging.";

var history = [];
var busy = false;

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function sendChip(q) {
  document.getElementById("user-input").value = q;
  sendMessage();
}

function addMsg(role, text) {
  var scroll = document.getElementById("chat-scroll");
  var wrap = document.createElement("div");
  wrap.className = "msg " + role;

  var av = document.createElement("div");
  av.className = "avatar " + (role === "user" ? "usr" : "ai");
  av.textContent = role === "user" ? "You" : "CW";

  var bub = document.createElement("div");
  bub.className = "bubble";
  bub.innerHTML = fmt(text);

  wrap.appendChild(av);
  wrap.appendChild(bub);
  scroll.appendChild(wrap);
  scroll.scrollTop = scroll.scrollHeight;
}

function showTyping() {
  var scroll = document.getElementById("chat-scroll");
  var wrap = document.createElement("div");
  wrap.className = "msg ai";
  wrap.id = "typing";
  var av = document.createElement("div");
  av.className = "avatar ai";
  av.textContent = "CW";
  var bub = document.createElement("div");
  bub.className = "bubble typing";
  bub.innerHTML = "<span></span><span></span><span></span>";
  wrap.appendChild(av);
  wrap.appendChild(bub);
  scroll.appendChild(wrap);
  scroll.scrollTop = scroll.scrollHeight;
}

function removeTyping() {
  var el = document.getElementById("typing");
  if (el) { el.remove(); }
}

function fmt(raw) {
  var lines = raw.split("\n");
  var out = [];
  var listBuf = [];

  function flushList() {
    if (listBuf.length > 0) {
      out.push("<ul style='padding-left:16px;margin:6px 0'>" + listBuf.join("") + "</ul>");
      listBuf = [];
    }
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i]
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    // bold
    line = line.replace(/[*][*](.+?)[*][*]/g, "<strong>$1</strong>");
    // headings
    line = line.replace(/^#{1,3} (.+)$/, "<strong>$1</strong>");

    if (/^[-] (.+)$/.test(line)) {
      listBuf.push("<li>" + line.replace(/^[-] /, "") + "</li>");
    } else if (line.trim() === "") {
      flushList();
    } else {
      flushList();
      out.push("<p>" + line + "</p>");
    }
  }
  flushList();
  return out.join("");
}

async function sendMessage() {
  if (busy) { return; }
  var inp = document.getElementById("user-input");
  var text = inp.value.trim();
  if (!text) { return; }
  inp.value = "";
  inp.style.height = "auto";
  busy = true;
  document.getElementById("send-btn").disabled = true;
  addMsg("user", text);
  history.push({ role: "user", content: text });
  showTyping();
  try {
    var res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: SYSTEM,
        messages: history
      })
    });
    var data = await res.json();
    removeTyping();
    var reply = "Sorry, no response received.";
    if (data.content && data.content.length > 0) {
      reply = data.content.map(function(b) { return b.text || ""; }).join("");
    }
    history.push({ role: "assistant", content: reply });
    addMsg("ai", reply);
  } catch(err) {
    removeTyping();
    addMsg("ai", "Connection issue - please try again.");
    history.pop();
  }
  busy = false;
  document.getElementById("send-btn").disabled = false;
}
</script>
