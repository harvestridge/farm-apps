<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Harvest Ridge – Chemical Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#2d6a2d;--green-light:#3d8c3d;--green-pale:#e8f3e8;--gold:#c8960c;--red:#c0392b;--red-light:#fdecea;--bg:#f4f1eb;--card:#fff;--border:#d6cfc4;--text:#1a1a1a;--muted:#6b6b6b;--radius:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;}
.app-header{background:var(--green);color:white;padding:16px 20px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.app-header h1{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1.5px;line-height:1;}
.app-header .sub{font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.content{padding:16px;max-width:680px;margin:0 auto;}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;overflow:hidden;}
.card-head{padding:12px 16px;background:var(--green-pale);border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--green);text-transform:uppercase;letter-spacing:.5px;}
.card-body{padding:14px 16px;}
.field-group{margin-bottom:14px;}
.field-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
input[type=text],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;background:white;}
input:focus,select:focus,textarea:focus{border-color:var(--green);}
textarea{resize:none;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.quarter-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
.quarter-btn{padding:10px;border:1.5px solid var(--border);border-radius:8px;background:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center;}
.quarter-btn.sel{background:var(--green);border-color:var(--green);color:white;}
.section-note{font-size:12px;color:var(--muted);margin-bottom:12px;padding:8px 12px;background:#f9f7f4;border-radius:8px;border-left:3px solid var(--gold);}
.chem-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:10px;overflow:hidden;}
.chem-head{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.chem-name{font-size:14px;font-weight:600;}
.chem-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;}
.badge-nonfood{background:#fef3c7;color:#92400e;}
.badge-food{background:var(--green-pale);color:var(--green);}
.chem-body{padding:12px 14px;}
.chem-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.chem-grid input{padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:'DM Sans',sans-serif;width:100%;}
.chem-grid input:focus{border-color:var(--green);outline:none;}
.chem-field-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.remove-btn{background:none;border:none;color:var(--red);font-size:13px;cursor:pointer;padding:2px 6px;border-radius:6px;}
.remove-btn:hover{background:var(--red-light);}
.add-chem-area{margin-bottom:4px;}
.add-chem-row{display:flex;gap:8px;align-items:flex-end;}
.add-chem-row input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;}
.add-chem-row select{width:130px;padding:10px 8px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;}
.add-chem-row button{padding:10px 16px;background:var(--green);color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.submit-btn{width:100%;padding:14px;background:var(--green);color:white;border:none;border-radius:var(--radius);font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer;margin-top:4px;transition:background .2s;}
.submit-btn:hover{background:var(--green-light);}
.submit-btn:disabled{background:#aaa;cursor:not-allowed;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:white;padding:12px 24px;border-radius:100px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;}
.toast.error{background:var(--red);}
</style>
</head>

          <button class="quarter-btn" id="q4" onclick="setQuarter('Q4','10.1','12.31')">Q4 — Oct to Dec</button>
        </div>
