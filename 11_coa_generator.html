<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Harvest Ridge – COA Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#2d6a2d;--green-light:#3d8c3d;--green-pale:#e8f3e8;--gold:#c8960c;--red:#c0392b;--red-light:#fdecea;--bg:#f4f1eb;--card:#fff;--border:#d6cfc4;--text:#1a1a1a;--muted:#6b6b6b;--radius:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;}
.app-header{background:var(--green);color:white;padding:16px 20px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.app-header h1{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1.5px;line-height:1;}
.app-header .sub{font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.app-header .sync-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.sync-status{font-size:11px;opacity:.8;}
.sync-btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:6px;color:white;font-size:11px;font-weight:600;padding:4px 10px;cursor:pointer;}
.content{padding:16px;max-width:680px;margin:0 auto;}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;overflow:hidden;}
.card-head{padding:12px 16px;background:var(--green-pale);border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--green);text-transform:uppercase;letter-spacing:.5px;}
.card-body{padding:14px 16px;}
.field-group{margin-bottom:13px;}
.field-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
input[type=text],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;background:white;}
input:focus,select:focus,textarea:focus{border-color:var(--green);}
textarea{resize:none;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.section-note{font-size:12px;color:var(--muted);margin-bottom:12px;padding:8px 12px;background:#f9f7f4;border-radius:8px;border-left:3px solid var(--gold);}
.field-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid #f0ece6;}
.field-row:last-child{border-bottom:none;}
.field-row-label{flex:1;font-size:13px;font-weight:500;}
.field-row-note{font-size:11px;color:var(--red);font-weight:600;margin-left:4px;}
.field-row input{width:120px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;text-align:center;}
.field-row input:focus{border-color:var(--green);outline:none;}
.field-row .unit{font-size:12px;color:var(--muted);width:24px;}
.section-divider{font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.6px;padding:10px 0 4px;border-bottom:1.5px solid var(--green-pale);margin-bottom:4px;}
.submit-btn{width:100%;padding:14px;background:var(--green);color:white;border:none;border-radius:var(--radius);font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer;margin-top:4px;transition:background .2s;}
.submit-btn:hover{background:var(--green-light);}
.submit-btn:disabled{background:#aaa;cursor:not-allowed;}
.print-btn{width:100%;padding:14px;color:white;border:none;border-radius:var(--radius);font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer;margin-top:8px;background:#1d4ed8;}
.print-btn:hover{background:#1e40af;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:white;padding:12px 24px;border-radius:100px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;}
.toast.error{background:var(--red);}
.lot-info-box{background:var(--green-pale);border-radius:8px;padding:12px 14px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.lot-info-item .lbl{font-size:11px;font-weight:600;color:var(--green);text-transform:uppercase;letter-spacing:.4px;}
.lot-info-item .val{font-weight:600;margin-top:1px;font-size:13px;}
.amy-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
.amy-table th{background:var(--green-pale);padding:6px 8px;text-align:center;font-size:10px;font-weight:600;color:var(--green);border:1px solid var(--border);}
.amy-table td{padding:4px 6px;border:1px solid var(--border);}
.amy-table input{width:100%;border:none;font-size:12px;font-family:'DM Sans',sans-serif;text-align:center;padding:2px;background:transparent;}
.amy-table input:focus{outline:1px solid var(--green);border-radius:2px;}
.add-row-btn{margin-top:6px;padding:6px 14px;background:var(--green-pale);border:1px dashed var(--green);border-radius:6px;color:var(--green);font-size:12px;font-weight:600;cursor:pointer;}
@media print{body{background:white;padding:0;}.app-header,.no-print,.card-head,.submit-btn,.print-btn,.section-note,.toast{display:none!important;}.card{border:none;border-radius:0;box-shadow:none;margin:0;padding:0;}.card-body{padding:0;}.content{padding:0;max-width:100%;}.coa-print{display:block!important;}}
.coa-print{display:none;font-family:Arial,sans-serif;font-size:11px;color:#000;}
.coa-title{font-size:16px;font-weight:bold;text-align:center;margin-bottom:4px;}
.coa-subtitle{font-size:11px;text-align:center;margin-bottom:12px;color:#444;}
.coa-header-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;margin-bottom:10px;}
.coa-header-row{display:flex;gap:6px;align-items:baseline;margin-bottom:3px;}
.coa-header-label{font-weight:bold;font-size:10px;white-space:nowrap;}
.coa-header-value{border-bottom:1px solid #000;flex:1;min-width:80px;font-size:11px;padding-bottom:1px;}
.coa-section-title{font-weight:bold;font-size:11px;margin:10px 0 4px;text-transform:uppercase;border-bottom:1.5px solid #000;padding-bottom:2px;}
.coa-result-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.coa-result-label{flex:1;font-size:11px;}
.coa-result-value{border-bottom:1px solid #000;width:80px;text-align:center;font-size:11px;padding-bottom:1px;}
.coa-result-unit{font-size:10px;color:#444;width:20px;}
.coa-comments{margin-top:10px;border-top:1px solid #ccc;padding-top:6px;}
.coa-signature-row{display:flex;gap:40px;margin-top:20px;}
.coa-signature-block{flex:1;}
.coa-signature-line{border-bottom:1px solid #000;margin-bottom:3px;height:20px;}
.coa-signature-label{font-size:10px;color:#444;}
.coa-footer{margin-top:16px;font-size:9px;color:#666;text-align:center;border-top:1px solid #ccc;padding-top:6px;}
.coa-address{font-size:10px;color:#444;margin-bottom:2px;}
</style>
</head>
<body>
<div class="app-header">
  <h1>Harvest Ridge</h1>
  <div class="sub">COA Generator</div>
  <div class="sync-row">
    <span class="sync-status" id="sync-status">⏳ Loading lots...</span>
    <button class="sync-btn" onclick="loadLots()">↻ Refresh</button>
  </div>
</div>
<div class="content">
  <div class="section-note">Select a customer COA template and a lot number. Grading data will auto-fill from your records.</div>
  <div class="card">
    <div class="card-head">Step 1 — Select COA Template & Lot</div>
    <div class="card-body">
      <div class="field-group"><div class="field-label">COA Template</div>
        <select id="coa-template" onchange="onTemplateChange()">
          <option value="">Select customer COA...</option>
          <option value="ackerman">Ackerman Marketing — Dry Beans</option>
          <option value="hrp-drybeans">HRP Standard — Dry Beans (Crux, Food to Live, etc.)</option>
          <option value="hrp-grain">HRP Standard — Grain (Wheat, Spelt, Rye, etc.)</option>
          <option value="soy-halves">HCI / Greenleaf — Soybean Halves</option>
          <option value="soy-pieces">HCI / California Natural — Soybean Pieces</option>
          <option value="blue-corn">Blue Corn QC Analysis</option>
          <option value="amys">Amy's Kitchen — Dry Bean Grading Report</option>
        </select>
      </div>
      <div class="field-group"><div class="field-label">Lot #</div>
        <select id="coa-lot" onchange="onLotChange()"><option value="">Select lot...</option></select>
      </div>
      <div id="lot-info-box" style="display:none;"></div>
    </div>
  </div>
  <div class="card" id="shipment-card" style="display:none;">
    <div class="card-head">Step 2 — Shipment Details</div>
    <div class="card-body" id="shipment-fields"></div>
  </div>
  <div class="card" id="coa-fields-card" style="display:none;">
    <div class="card-head">Step 3 — Quality Results</div>
    <div class="card-body" id="coa-fields-body"></div>
  </div>
  <div class="card" id="signoff-card" style="display:none;">
    <div class="card-head">Step 4 — Sign Off</div>
    <div class="card-body">
      <div class="two-col">
        <div class="field-group"><div class="field-label">Graded By</div><select id="graded-by"><option value="">Select...</option><option>Adrianna</option><option>Tiffany</option></select></div>
        <div class="field-group"><div class="field-label">Date Graded</div><input type="date" id="date-graded"></div>
      </div>
      <div class="field-group"><div class="field-label">Comments</div><textarea id="coa-comments" rows="2" placeholder="Any additional comments..."></textarea></div>
    </div>
  </div>
  <button class="submit-btn no-print" id="generateBtn" onclick="generateCOA()" style="display:none;">Generate COA</button>
  <button class="print-btn no-print" id="printBtn" onclick="window.print()" style="display:none;">🖨 Print / Save as PDF</button>
</div>
<div id="coa-print-area" class="coa-print"></div>
<div class="toast" id="toast"></div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyt-uIpn_8halewmHanICU6fhxta-vzvxdfRbYal_kyDKa6KsBVQ2FAX70vKcLnmi-s5g/exec";
let allLots={};let currentLot=null;let coaFields={};let amyRows=[];
const TEMPLATES={ackerman:{name:'Ackerman Marketing',commodity:'Organic Black Beans',destination:'Ackerman Marketing c/o Morgan Foods\n90 W. Morgan Street Austin IN 47102',extraShipment:[{id:'ack-num',label:'ACK #'},{id:'packaged-in',label:'Packaged In',default:'Totes'}],quality:[],sections:[{title:'Quality',fields:[{id:'moisture',label:'Moisture',unit:'%',autoFill:'Moisture'},{id:'checked-dry',label:'Checked Seedcoats (Dry)',unit:'%'},{id:'checked-wet',label:'Checked Seedcoats (Wet)',unit:'%'},{id:'musty',label:'Questionable Order - Musty',unit:'%',note:'Zero Tolerance'},{id:'infestation',label:'Infestation',unit:'%',note:'Zero Tolerance'},{id:'hazardous-fm',label:'Hazardous Foreign Material',unit:'%',note:'Zero Tolerance'},{id:'size-count',label:'Size Count',unit:'%'}]},{title:'Defects',fields:[{id:'splits',label:'Splits / Broken',unit:'%',autoFill:'Splits'},{id:'damaged',label:'Damaged / Discolored / Blemished',unit:'%',autoFill:'Damaged'},{id:'sprouts',label:'Sprouts',unit:'%'},{id:'insect',label:'Insect Damage',unit:'%'},{id:'badly',label:'Badly Damaged',unit:'%'}]},{title:'Foreign Material',fields:[{id:'contrasting',label:'Contrasting Classes',unit:'%'},{id:'dirt',label:'Dirt',unit:'%',autoFill:'Rock/Dirt'},{id:'stones',label:'Stones',unit:'%'},{id:'mold',label:'Mold',unit:'%'},{id:'nightshade',label:'Nightshade',unit:'%',note:'Zero Tolerance'},{id:'pieces',label:'No. of Pieces (Corn/Soy/Wheat)',unit:'%'}]}]},'hrp-drybeans':{name:'HRP Standard — Dry Beans',commodity:'',destination:'',extraShipment:[{id:'packaged-in',label:'Packaged In',default:'Totes'},{id:'tote-detail',label:'Tote Detail (e.g. totes 1-8 @ 2,200lbs)'}],quality:[],sections:[{title:'Quality',fields:[{id:'moisture',label:'Moisture',unit:'%',autoFill:'Moisture'},{id:'checked-dry',label:'Checked Seedcoats (Dry)',unit:'%'},{id:'checked-wet',label:'Checked Seedcoats (Wet)',unit:'%'},{id:'musty',label:'Questionable Order - Musty',unit:'%',note:'Zero Tolerance'},{id:'infestation',label:'Infestation',unit:'%',note:'Zero Tolerance'},{id:'hazardous-fm',label:'Hazardous Foreign Material',unit:'%',note:'Zero Tolerance'},{id:'other-defects',label:'Other Notable Defects',unit:'%'}]},{title:'Defects',fields:[{id:'splits',label:'Splits / Broken',unit:'%',autoFill:'Splits'},{id:'damaged',label:'Damaged / Discolored / Blemished',unit:'%',autoFill:'Damaged'},{id:'sprouts',label:'Sprouts',unit:'%'},{id:'insect',label:'Insect Damage',unit:'%'},{id:'badly',label:'Badly Damaged',unit:'%'}]},{title:'Foreign Material',fields:[{id:'contrasting',label:'Contrasting Classes',unit:'%'},{id:'dirt',label:'Dirt',unit:'%',autoFill:'Rock/Dirt'},{id:'stones',label:'Stones',unit:'%'},{id:'mold',label:'Mold',unit:'%'},{id:'nightshade',label:'Nightshade',unit:'%',note:'Zero Tolerance'},{id:'pieces',label:'No. of Pieces (Corn/Soy/Wheat)',unit:'%'}]}]},'hrp-grain':{name:'HRP Standard — Grain',commodity:'',destination:'',extraShipment:[{id:'packaged-in',label:'Packaged In',default:'Paper'},{id:'tote-detail',label:'Package Detail (e.g. 50-50lb bags)'}],quality:[],sections:[{title:'Quality',fields:[{id:'moisture',label:'Moisture',unit:'%',autoFill:'Moisture'},{id:'test-weight',label:'Test Weight',unit:'lbs',autoFill:'Test Weight'},{id:'protein',label:'Protein',unit:'%'},{id:'vomitoxin',label:'Vomitoxin',unit:'ppb'},{id:'musty',label:'Questionable Order - Musty',unit:'%',note:'Zero Tolerance'},{id:'infestation',label:'Infestation',unit:'%',note:'Zero Tolerance'}]},{title:'Defects',fields:[{id:'off-color',label:'Off Color',unit:'%'},{id:'shrunken',label:'Shrunken/Broken',unit:'%',autoFill:'Shrunken/Broken'},{id:'other-classes',label:'Grain of Other Classes',unit:'%',autoFill:'Grain of Other Classes'}]},{title:'Foreign Material',fields:[{id:'dirt',label:'Dirt',unit:'%',autoFill:'Rock/Dirt'},{id:'stones',label:'Stones',unit:'%'},{id:'plant-material',label:'Plant Material',unit:'%',autoFill:'Plant Material'},{id:'hazardous-fm',label:'Hazardous Foreign Material',unit:'%',note:'Zero Tolerance'},{id:'mold',label:'Mold',unit:'%'},{id:'other-defects',label:'Other Notable Defects',unit:'%'},{id:'pieces',label:'No. of Pieces (Corn/Soy)',unit:'%'}]}]},'soy-halves':{name:'HCI / Greenleaf — Soybean Halves',commodity:'Organic Dehulled Soybeans - Halves',destination:'HCI c/o Greenleaf Foods SPC\n8735 East 33rd Street Bldg B Indianapolis IN 46226',extraShipment:[{id:'consignee-ref',label:'Consignee / Ref #'},{id:'sgs-report',label:'SGS Report #'},{id:'packaged-in',label:'Packaged In',default:'Totes'},{id:'tote-detail',label:'Tote Detail (e.g. totes 1-19 @ 2,204lbs)'}],quality:[],sections:[{title:'Quality',fields:[{id:'moisture',label:'Moisture',unit:'%',autoFill:'Moisture'},{id:'non-gmo',label:'Non-GMO Test (in-house)',unit:'p/f'},{id:'gluten',label:'Gluten Test (in-house)',unit:'p/f'},{id:'screen4',label:'Screen Size 4 (75% min)',unit:'%'},{id:'screen8',label:'Screen Size 8 (20% max)',unit:'%'},{id:'screen12',label:'Screen Size 12 (5% max)',unit:'%'},{id:'musty',label:'Questionable Order - Musty',unit:'%',note:'Zero Tolerance'},{id:'infestation',label:'Infestation',unit:'%',note:'Zero Tolerance'},{id:'hazardous-fm',label:'Hazardous Foreign Material',unit:'%',note:'Zero Tolerance'},{id:'other-defects',label:'Other Notable Defects',unit:'%'}]},{title:'Defects',fields:[{id:'off-color',label:'Off Color',unit:'%'},{id:'hull-pieces',label:'Hull Pieces',unit:'%'},{id:'hulls-attached',label:'Pieces with Hulls Attached',unit:'%'},{id:'whole-beans',label:'Whole Beans',unit:'%'}]},{title:'Foreign Material',fields:[{id:'dirt',label:'Dirt',unit:'%',autoFill:'Rock/Dirt'},{id:'stones',label:'Stones',unit:'%'},{id:'plant-material',label:'Plant Material',unit:'%',autoFill:'Plant Material'},{id:'mold',label:'Mold',unit:'%'},{id:'pieces',label:'No. of Pieces (Corn/Wheat)',unit:'%'}]}]},'soy-pieces':{name:'HCI / California Natural — Soybean Pieces',commodity:'Organic Dehulled Soybean (pieces)',destination:'HC International c/o California Natural Products\n1250 E Lathrop Rd. Lathrop CA 95330',extraShipment:[{id:'consignee-ref',label:'Consignee / Ref #'},{id:'sgs-sample',label:'SGS Sample ID'},{id:'packaged-in',label:'Packaged In',default:'Totes'},{id:'tote-detail',label:'Tote Detail (e.g. totes 1-21)'}],quality:[],sections:[{title:'Quality',fields:[{id:'moisture',label:'Moisture',unit:'%',autoFill:'Moisture'},{id:'non-gmo',label:'Non-GMO Test',unit:'p/f'},{id:'gluten',label:'Gluten Test',unit:'p/f'},{id:'screen4',label:'Screen Size 4 (10% max)',unit:'%'},{id:'screen8',label:'Screen Size 8 (70% min)',unit:'%'},{id:'screen12',label:'Screen Size 12 (10% max)',unit:'%'},{id:'screen18',label:'Screen Size 18 (5% max)',unit:'%'},{id:'musty',label:'Questionable Order - Musty',unit:'%',note:'Zero Tolerance'},{id:'infestation',label:'Infestation',unit:'%',note:'Zero Tolerance'},{id:'hazardous-fm',label:'Hazardous Foreign Material',unit:'%',note:'Zero Tolerance'},{id:'other-defects',label:'Other Notable Defects',unit:'%'}]},{title:'Defects',fields:[{id:'off-color',label:'Off Color',unit:'%'},{id:'hull-pieces',label:'Hull Pieces',unit:'%'},{id:'hulls-attached',label:'Pieces with Hulls Attached',unit:'%'},{id:'whole-beans',label:'Whole Beans',unit:'%'}]},{title:'Foreign Material',fields:[{id:'dirt',label:'Dirt',unit:'%',autoFill:'Rock/Dirt'},{id:'stones',label:'Stones',unit:'%'},{id:'plant-material',label:'Plant Material',unit:'%',autoFill:'Plant Material'},{id:'mold',label:'Mold',unit:'%'},{id:'pieces',label:'No. of Pieces (Corn/Wheat)',unit:'%'}]}]},'blue-corn':{name:'Blue Corn QC Analysis',commodity:'Organic Blue Corn',destination:'',extraShipment:[{id:'load-detail',label:'Load Detail (e.g. Bulk Load, 22,400lbs)'}],quality:[],sections:[{title:'QC Results',fields:[{id:'moisture',label:'Moisture',unit:'%',autoFill:'Moisture'},{id:'test-weight',label:'Test Weight',unit:'lbs',autoFill:'Test Weight'},{id:'cracked',label:'Cracked/Broken Kernels',unit:'%',autoFill:'Broken/Cracked'},{id:'mold-damage',label:'Mold Damage',unit:'%'},{id:'kernels-oz',label:'Kernels per Oz',unit:'ct',autoFill:'Pieces per Ounce'},{id:'other-color',label:'Other Color',unit:'%',autoFill:'Different Colored'},{id:'foreign-material',label:'Foreign Material',unit:'%',autoFill:'Total Screen Out'},{id:'aflatoxin',label:'Aflatoxin Level',unit:'ppb'},{id:'fumonisins',label:'Fumonisins',unit:'ppm'},{id:'non-gmo',label:'Non-GMO',unit:'%'}]}]},amys:{name:"Amy's Kitchen — Dry Bean Grading",commodity:'',destination:'COA@amys.com',extraShipment:[{id:'amys-item',label:"Amy's Item #"},{id:'grower-lot',label:'Grower Lot #'},{id:'cleaner-lot',label:'Cleaner Lot #'}],quality:[],sections:[],isAmys:true}};
async function loadLots(){document.getElementById('sync-status').textContent='⏳ Loading lots...';try{const resp=await fetch(`${SCRIPT_URL}?tab=WarehouseGrading`);const rows=JSON.parse(await resp.text());allLots={};if(rows.length>1){for(let i=1;i<rows.length;i++){const r=rows[i];const lotNum=r[3];if(!lotNum)continue;if(!allLots[lotNum]){let gradeData={};try{gradeData=JSON.parse(r[11]||'{}');}catch(e){}allLots[lotNum]={lotNum,date:r[1],inspector:r[2],sampleNum:r[4],crop:r[5],grower:r[6],status:r[7],totesIn:r[8],lbs:r[9],notes:r[10],gradeData};}}}const select=document.getElementById('coa-lot');const current=select.value;select.innerHTML='<option value="">Select lot...</option>';Object.values(allLots).reverse().forEach(lot=>{const opt=document.createElement('option');opt.value=lot.lotNum;opt.textContent=`${lot.lotNum} — ${lot.crop} (${lot.status})`;select.appendChild(opt);});if(current)select.value=current;document.getElementById('sync-status').textContent=`✓ ${Object.keys(allLots).length} lots loaded`;}catch(err){document.getElementById('sync-status').textContent='⚠ Could not load lots';}}
function onTemplateChange(){const template=document.getElementById('coa-template').value;const lotNum=document.getElementById('coa-lot').value;if(template&&lotNum)buildCOAForm();else hideCards();}
function onLotChange(){const lotNum=document.getElementById('coa-lot').value;currentLot=allLots[lotNum]||null;if(currentLot){const box=document.getElementById('lot-info-box');box.style.display='grid';box.className='lot-info-box';box.innerHTML=`<div class="lot-info-item"><div class="lbl">Lot #</div><div class="val">${currentLot.lotNum}</div></div><div class="lot-info-item"><div class="lbl">Crop</div><div class="val">${currentLot.crop}</div></div><div class="lot-info-item"><div class="lbl">Grower</div><div class="val">${currentLot.grower}</div></div><div class="lot-info-item"><div class="lbl">Date Processed</div><div class="val">${currentLot.date}</div></div><div class="lot-info-item"><div class="lbl">Totes</div><div class="val">${currentLot.totesIn}</div></div><div class="lot-info-item"><div class="lbl">Status</div><div class="val">${currentLot.status}</div></div>`;}else{document.getElementById('lot-info-box').style.display='none';}const template=document.getElementById('coa-template').value;if(template&&lotNum)buildCOAForm();else hideCards();}
function hideCards(){['shipment-card','coa-fields-card','signoff-card','generateBtn','printBtn'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display='none';});document.getElementById('coa-print-area').innerHTML='';}
function buildCOAForm(){const templateKey=document.getElementById('coa-template').value;const tmpl=TEMPLATES[templateKey];if(!tmpl)return;const lot=currentLot;const shipCard=document.getElementById('shipment-card');const shipFields=document.getElementById('shipment-fields');shipCard.style.display='block';shipFields.innerHTML=`<div class="two-col"><div class="field-group"><div class="field-label">Date Shipped</div><input type="date" id="date-shipped"></div><div class="field-group"><div class="field-label">PO #</div><input type="text" id="po-num" placeholder="e.g. 870560"></div></div><div class="field-group"><div class="field-label">Buyer / Destination</div><input type="text" id="buyer-dest" value="${(tmpl.destination||'').replace(/\n/g,' | ')}"></div>${(tmpl.extraShipment||[]).map(f=>`<div class="field-group"><div class="field-label">${f.label}</div><input type="text" id="${f.id}" value="${f.default||''}"></div>`).join('')}`;
const coaCard=document.getElementById('coa-fields-card');const coaBody=document.getElementById('coa-fields-body');coaCard.style.display='block';coaFields={};
if(tmpl.isAmys){amyRows=[{time:'',tote:'',evm:'',metal:'',rocks:'',dissolvable:'',allergens:'',other:'',total:'',contrasting:'',blend:''}];coaBody.innerHTML=`<div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Enter results per tote. Min 6 lbs/2500g per tote for FM, min 1 lb/500g for defects.</div><div style="overflow-x:auto;"><table class="amy-table" id="amy-table"><thead><tr><th>Time</th><th>Tote #</th><th>Injurious EVM</th><th>Metal/Glass/Plastic</th><th>Rocks & Caliche</th><th>Dissolvable Dirt</th><th>Allergens</th><th>Other FM</th><th>Total Defects</th><th>Contrasting Classes</th><th>Classes that Blend</th></tr></thead><tbody id="amy-tbody"></tbody></table></div><button class="add-row-btn" onclick="addAmyRow()">+ Add Tote Row</button><div class="field-group" style="margin-top:12px;"><div class="field-label">Moisture % (avg)</div><input type="text" id="amy-moisture" value="${lot?.gradeData?.Moisture||''}"></div><div class="field-group"><div class="field-label">Description of recleaning (if applicable)</div><textarea id="amy-reclean" rows="2" placeholder="Describe any recleaning actions taken..."></textarea></div>`;renderAmyTable();}
else{let html='';tmpl.sections.forEach(section=>{html+=`<div class="section-divider">${section.title}</div>`;section.fields.forEach(f=>{const autoVal=f.autoFill&&lot?.gradeData?.[f.autoFill]?lot.gradeData[f.autoFill]:'';coaFields[f.id]=autoVal;html+=`<div class="field-row"><div class="field-row-label">${f.label}${f.note?`<span class="field-row-note"> ${f.note}</span>`:''}</div><input type="text" id="cf-${f.id}" value="${autoVal}" oninput="coaFields['${f.id}']=this.value"><div class="field-row unit">${f.unit}</div></div>`;});});coaBody.innerHTML=html;}
document.getElementById('signoff-card').style.display='block';document.getElementById('date-graded').value=lot?.date||new Date().toISOString().split('T')[0];document.getElementById('generateBtn').style.display='block';document.getElementById('printBtn').style.display='none';document.getElementById('coa-print-area').innerHTML='';}
function renderAmyTable(){const tbody=document.getElementById('amy-tbody');tbody.innerHTML='';amyRows.forEach((row,i)=>{const cols=['time','tote','evm','metal','rocks','dissolvable','allergens','other','total','contrasting','blend'];const tr=document.createElement('tr');tr.innerHTML=cols.map(c=>`<td><input value="${row[c]||''}" oninput="amyRows[${i}]['${c}']=this.value"></td>`).join('');tbody.appendChild(tr);});}
function addAmyRow(){amyRows.push({time:'',tote:'',evm:'',metal:'',rocks:'',dissolvable:'',allergens:'',other:'',total:'',contrasting:'',blend:''});renderAmyTable();}
function generateCOA(){const templateKey=document.getElementById('coa-template').value;const tmpl=TEMPLATES[templateKey];const lot=currentLot;if(!lot||!tmpl){showToast('Please select a template and lot',true);return;}const dateShipped=document.getElementById('date-shipped').value;const poNum=document.getElementById('po-num').value;const buyerDest=document.getElementById('buyer-dest').value;const gradedBy=document.getElementById('graded-by').value;const dateGraded=document.getElementById('date-graded').value;const comments=document.getElementById('coa-comments').value;let html='';
if(tmpl.isAmys){const amysItem=document.getElementById('amys-item')?.value||'';const growerLot=document.getElementById('grower-lot')?.value||'';const cleanerLot=document.getElementById('cleaner-lot')?.value||'';const moisture=document.getElementById('amy-moisture')?.value||'';const reclean=document.getElementById('amy-reclean')?.value||'';html=`<div class="coa-title">Amy's Kitchen Category 2 and 3 Dry Bean Grading Report</div><div class="coa-subtitle">Please send completed grade sheets to COA@amys.com</div><div class="coa-header-grid"><div><div class="coa-header-row"><span class="coa-header-label">PO#:</span><span class="coa-header-value">${poNum}</span></div></div><div><div class="coa-header-row"><span class="coa-header-label">Date Cleaned:</span><span class="coa-header-value">${lot.date}</span></div></div><div><div class="coa-header-row"><span class="coa-header-label">Grower Lot #:</span><span class="coa-header-value">${growerLot}</span></div></div><div><div class="coa-header-row"><span class="coa-header-label">Amy's Item #:</span><span class="coa-header-value">${amysItem}</span></div></div><div><div class="coa-header-row"><span class="coa-header-label">Cleaner Lot #:</span><span class="coa-header-value">${cleanerLot}</span></div></div><div><div class="coa-header-row"><span class="coa-header-label">Moisture % (avg):</span><span class="coa-header-value">${moisture}</span></div></div></div><table style="width:100%;border-collapse:collapse;font-size:10px;margin-top:8px;"><thead><tr style="background:#e8f3e8;"><th style="border:1px solid #ccc;padding:4px;text-align:center;">Time</th><th style="border:1px solid #ccc;padding:4px;text-align:center;">Tote #</th><th style="border:1px solid #ccc;padding:4px;text-align:center;">Injurious EVM</th><th style="border:1px solid #ccc;padding:4px;text-align:center;">Metal/Glass/Plastic</th><th style="border:1px solid #ccc;padding:4px;text-align:center;">Rocks & Caliche</th><th style="border:1px solid #ccc;padding:4px;text-align:center;">Dissolvable Dirt</th><th style="border:1px solid #ccc;padding:4px;text-align:center;">Allergens</th><th style="border:1px solid #ccc;padding:4px;text-align:center;">Other FM</th><th style="border:1px solid #ccc;padding:4px;text-align:center;">Total Defects</th><th style="border:1px solid #ccc;padding:4px;text-align:center;">Contrasting Classes</th><th style="border:1px solid #ccc;padding:4px;text-align:center;">Classes that Blend</th></tr></thead><tbody>${amyRows.map(r=>`<tr>${['time','tote','evm','metal','rocks','dissolvable','allergens','other','total','contrasting','blend'].map(c=>`<td style="border:1px solid #ccc;padding:5px 4px;text-align:center;min-height:18px;">${r[c]||'&nbsp;'}</td>`).join('')}</tr>`).join('')}</tbody></table>${reclean?`<div style="margin-top:10px;"><strong>Description of recleaning:</strong> ${reclean}</div>`:''}<div class="coa-signature-row" style="margin-top:20px;"><div class="coa-signature-block"><div class="coa-signature-line">${gradedBy}</div><div class="coa-signature-label">Cleaner's Signature</div></div><div class="coa-signature-block"><div class="coa-signature-line">${dateGraded}</div><div class="coa-signature-label">Date</div></div></div><div class="coa-footer">Amy's Kitchen, LLC. Confidential Information — Please send completed grade sheet to COA@amys.com</div>`;}
else{const extraFields=(tmpl.extraShipment||[]).map(f=>`<div class="coa-header-row"><span class="coa-header-label">${f.label}:</span><span class="coa-header-value">${document.getElementById(f.id)?.value||''}</span></div>`).join('');let resultsHtml='';tmpl.sections.forEach(section=>{resultsHtml+=`<div class="coa-section-title">${section.title}</div>`;section.fields.forEach(f=>{const val=document.getElementById(`cf-${f.id}`)?.value||'';resultsHtml+=`<div class="coa-result-row"><div class="coa-result-label">${f.label}${f.note?` <span style="color:#c00;font-size:9px;">(${f.note})</span>`:''}</div><div class="coa-result-value">${val}</div><div class="coa-result-unit">${f.unit}</div></div>`;});});html=`<div class="coa-title">CERTIFICATE OF ANALYSIS</div><div style="margin-bottom:10px;"><div class="coa-address"><strong>Processing Plant:</strong> Harvest Ridge Processing &nbsp;|&nbsp; 142 W. Elmwood Rd. Caro MI 48723</div></div><div class="coa-header-grid"><div><div class="coa-header-row"><span class="coa-header-label">Buyer / Destination:</span></div><div style="font-size:11px;margin-bottom:6px;">${buyerDest}</div><div class="coa-header-row"><span class="coa-header-label">Commodity:</span><span class="coa-header-value">${lot.crop}</span></div><div class="coa-header-row"><span class="coa-header-label">Lot #:</span><span class="coa-header-value">${lot.lotNum}</span></div><div class="coa-header-row"><span class="coa-header-label">Grower:</span><span class="coa-header-value">${lot.grower}</span></div>${extraFields}</div><div><div class="coa-header-row"><span class="coa-header-label">Date Processed:</span><span class="coa-header-value">${lot.date}</span></div><div class="coa-header-row"><span class="coa-header-label">Date Shipped:</span><span class="coa-header-value">${dateShipped}</span></div><div class="coa-header-row"><span class="coa-header-label">PO #:</span><span class="coa-header-value">${poNum}</span></div><div class="coa-header-row"><span class="coa-header-label">Totes / Weight:</span><span class="coa-header-value">${lot.totesIn} totes / ${parseInt(lot.lbs||0).toLocaleString()} lbs</span></div></div></div>${resultsHtml}${comments?`<div class="coa-comments"><strong>Comments:</strong> ${comments}</div>`:''}<div class="coa-signature-row"><div class="coa-signature-block"><div class="coa-signature-line">${gradedBy}</div><div class="coa-signature-label">Graded By</div></div><div class="coa-signature-block"><div class="coa-signature-line">${dateGraded}</div><div class="coa-signature-label">Date Graded</div></div></div><div class="coa-footer">Harvest Ridge Processing &nbsp;|&nbsp; 142 W. Elmwood Rd. Caro MI 48723 &nbsp;|&nbsp; Organic Certified</div>`;}
document.getElementById('coa-print-area').innerHTML=html;document.getElementById('coa-print-area').style.display='block';document.getElementById('printBtn').style.display='block';showToast('✓ COA generated — tap Print to save as PDF',false);setTimeout(()=>document.getElementById('coa-print-area').scrollIntoView({behavior:'smooth'}),300);}
function showToast(msg,isError){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(isError?' error':'');setTimeout(()=>t.className='toast',3500);}
loadLots();
</script>
</body>
</html>
