<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Harvest Ridge – PM Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#2d6a2d;--green-light:#3d8c3d;--green-pale:#e8f3e8;--gold:#c8960c;--red:#c0392b;--red-light:#fdecea;--bg:#f4f1eb;--card:#fff;--border:#d6cfc4;--text:#1a1a1a;--muted:#6b6b6b;--radius:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;}
.app-header{background:var(--green);color:white;padding:16px 20px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.app-header h1{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1.5px;line-height:1;}
.app-header .sub{font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.header-meta{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
.header-meta input,.header-meta select{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;color:white;font-family:'DM Sans',sans-serif;font-size:13px;padding:6px 10px;outline:none;}
.header-meta input::placeholder{color:rgba(255,255,255,.6);}
.header-meta select option{color:#000;}
.content{padding:16px;max-width:680px;margin:0 auto;}
.section{display:none;}
.section.active{display:block;}
.equip-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:10px;overflow:hidden;cursor:pointer;transition:box-shadow .15s;}
.equip-card:active{box-shadow:0 2px 8px rgba(0,0,0,.1);}
.equip-row{display:flex;align-items:center;gap:12px;padding:14px 16px;}
.equip-icon{width:36px;height:36px;border-radius:8px;background:var(--green-pale);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.equip-info{flex:1;}
.equip-name{font-size:14px;font-weight:600;}
.equip-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.equip-arrow{font-size:18px;color:var(--muted);}
.freq-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;}
.freq-monthly{background:#e8f3e8;color:var(--green);}
.freq-weekly{background:#eff6ff;color:#1d4ed8;}
.freq-yearly{background:#fef3c7;color:#92400e;}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--green);font-size:14px;font-weight:600;cursor:pointer;padding:0;margin-bottom:14px;}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;overflow:hidden;}
.card-head{padding:12px 16px;background:var(--green-pale);border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--green);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center;}
.card-head span{font-size:11px;color:var(--muted);font-weight:400;text-transform:none;}
.task-row{padding:10px 16px;border-bottom:0.5px solid #f0ece6;}
.task-row:last-child{border-bottom:none;}
.task-top{display:flex;align-items:flex-start;gap:8px;}
.task-label{flex:1;font-size:13px;line-height:1.5;padding-top:2px;}
.pf-btns{display:flex;gap:5px;flex-shrink:0;}
.pf-btns button{padding:5px 10px;border-radius:14px;border:1.5px solid var(--border);background:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-pass.sel{background:var(--green);border-color:var(--green);color:white;}
.btn-fail.sel{background:var(--red);border-color:var(--red);color:white;}
.task-extra{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;}
.task-extra input{flex:0 0 70px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;text-align:center;}
.task-extra textarea{flex:1;min-width:160px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;resize:none;}
.task-extra input:focus,.task-extra textarea:focus{border-color:var(--green);outline:none;}
.field-group{margin-bottom:12px;}
.field-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
input[type=text],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;background:white;}
input:focus,select:focus,textarea:focus{border-color:var(--green);}
textarea{resize:none;}
.submit-btn{width:100%;padding:14px;background:var(--green);color:white;border:none;border-radius:var(--radius);font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer;margin-top:4px;transition:background .2s;}
.submit-btn:hover{background:var(--green-light);}
.submit-btn:disabled{background:#aaa;cursor:not-allowed;}
.section-note{font-size:12px;color:var(--muted);margin-bottom:12px;padding:8px 12px;background:#f9f7f4;border-radius:8px;border-left:3px solid var(--gold);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:white;padding:12px 24px;border-radius:100px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;}
.toast.error{background:var(--red);}
.progress-wrap{background:#e0ddd8;height:5px;}
.progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width .3s;}
.tab-bar{display:flex;background:var(--green-light);overflow-x:auto;scrollbar-width:none;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{flex:0 0 auto;padding:10px 16px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;color:rgba(255,255,255,.7);background:none;border:none;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;border-bottom:3px solid transparent;}
.tab-btn.active{color:white;border-bottom-color:var(--gold);}
</style>
</head>
<body>
<div class="app-header">
  <h1>Harvest Ridge</h1>
  <div class="sub">Preventative Maintenance Schedule</div>
  <div class="header-meta">

</div>
<div class="tab-bar">

  <button class="tab-btn" id="tabbtn-weekly" onclick="switchTab('weekly',this)">Weekly</button>
  <button class="tab-btn" id="tabbtn-vehicles" onclick="switchTab('vehicles',this)">Vehicles</button>
</div>
<div class="content">

    <div id="weekly-detail-view" style="display:none;"><button class="back-btn" onclick="showWeeklyList()">← Back to Categories</button><div id="weekly-detail-content"></div></div>
  </div>
  <div class="section" id="tab-vehicles">
    <div id="vehicles-list-view"><div class="section-note">Select a vehicle to log its PM tasks.</div><div id="vehicles-equip-list"></div></div>
    <div id="vehicles-detail-view" style="display:none;"><button class="back-btn" onclick="showVehiclesList()">← Back to Vehicles</button><div id="vehicles-detail-content"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

const VEHICLES=[{id:'dump-truck',name:'1978 Chevrolet Tandem Dump Truck',icon:'🚛',tasks:[{t:'Annual CAM inspection',f:'August'}]},{id:'semi-tractor',name:'1987 Ford LTL 9000 Semi Tractor',icon:'🚛',tasks:[{t:'Annual CAM inspection',f:'August'}]},{id:'semi-trailer',name:'1985 Great Dane Semi Trailer',icon:'🚛',tasks:[{t:'Annual CAM inspection',f:'August'}]},{id:'f150',name:'Ford F-150',icon:'🚗',tasks:[{t:'Oil change (every 5,000 miles)',f:'Every 5,000 mi'},{t:'Annual CAM maintenance',f:'August'}]},{id:'jd-2025r',name:'John Deere 2025R Tractor',icon:'🚜',tasks:[{t:'Annual CAM inspection',f:'August'}]},{id:'jd-120r',name:'John Deere 120R Loader',icon:'🚜',tasks:[{t:'Annual CAM inspection',f:'August'}]},{id:'hyster',name:'Forklift — Hyster H55XM',icon:'🏭',tasks:[{t:'Per Barrons schedule',f:'Per Barrons'}]},{id:'caterpillar',name:'Forklift — Caterpillar GP25K',icon:'🏭',tasks:[{t:'Per Barrons schedule',f:'Per Barrons'}]},{id:'yale',name:'Forklift — Yale',icon:'🏭',tasks:[{t:'Per Barrons schedule',f:'Per Barrons'}]}];
const taskStates={};
function switchTab(name,btn){document.querySelectorAll('.section').forEach(s=>s.style.display='none');document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+name).style.display='block';btn.classList.add('active');window.scrollTo(0,0);}
function buildEquipList(equipArray,containerId,detailFn){const container=document.getElementById(containerId);container.innerHTML='';equipArray.forEach(equip=>{const card=document.createElement('div');card.className='equip-card';card.onclick=()=>detailFn(equip.id);card.innerHTML=`<div class="equip-row"><div class="equip-icon">${equip.icon}</div><div class="equip-info"><div class="equip-name">${equip.name}</div><div class="equip-meta">${equip.tasks.length} tasks</div></div><div class="equip-arrow">›</div></div>`;container.appendChild(card);});}
function showEquipDetail(equip,contentId,submitFn){taskStates[equip.id]=equip.tasks.map(t=>({task:t.t,freq:t.f,result:'',initials:'',notes:''}));let html=`<div class="card"><div class="card-head">${equip.name} <span>${equip.tasks.length} tasks</span></div><div class="progress-wrap"><div class="progress-fill" id="pfill-${equip.id}" style="width:0%"></div></div><div id="tasklist-${equip.id}">`;equip.tasks.forEach((task,i)=>{const freqClass=task.f==='Monthly'?'freq-monthly':task.f==='Weekly'?'freq-weekly':'freq-yearly';html+=`<div class="task-row"><div class="task-top"><div class="task-label"><span class="freq-badge ${freqClass}">${task.f}</span><br>${task.t}</div><div class="pf-btns"><button class="btn-pass" id="pass-${equip.id}-${i}" onclick="setTaskResult('${equip.id}',${i},'Pass')">✓</button><button class="btn-fail" id="fail-${equip.id}-${i}" onclick="setTaskResult('${equip.id}',${i},'Fail')">✗</button></div></div><div class="task-extra"><input type="text" maxlength="6" placeholder="Initials" id="init-${equip.id}-${i}" oninput="taskStates['${equip.id}'][${i}].initials=this.value"><textarea rows="1" placeholder="Notes (optional)" id="notes-${equip.id}-${i}" oninput="taskStates['${equip.id}'][${i}].notes=this.value"></textarea></div></div>`;});html+=`</div></div><div class="card"><div class="card-head">Manager Sign-Off</div><div style="padding:14px 16px;"><div class="field-group"><div class="field-label">General Notes</div><textarea id="general-notes-${equip.id}" rows="2" placeholder="Any additional notes for this equipment..."></textarea></div><div class="field-group"><div class="field-label">Verified By</div><select id="verified-by-${equip.id}"><option value="">Select manager</option><option>Tyler</option><option>Allen</option><option>Andy</option><option>Tim</option><option>Aaron</option></select></div></div></div><button class="submit-btn" onclick="${submitFn}('${equip.id}')">Submit to Google Sheets</button>`;document.getElementById(contentId).innerHTML=html;}
function setTaskResult(equipId,i,val){taskStates[equipId][i].result=val;document.getElementById(`pass-${equipId}-${i}`).className='btn-pass'+(val==='Pass'?' sel':'');document.getElementById(`fail-${equipId}-${i}`).className='btn-fail'+(val==='Fail'?' sel':'');updatePMProgress(equipId);}
function updatePMProgress(equipId){const tasks=taskStates[equipId];const done=tasks.filter(t=>t.result).length;document.getElementById(`pfill-${equipId}`).style.width=`${(done/tasks.length)*100}%`;}
function showMonthlyList(){document.getElementById('monthly-list-view').style.display='block';document.getElementById('monthly-detail-view').style.display='none';}
function showMonthlyDetail(equipId){const equip=MONTHLY_EQUIPMENT.find(e=>e.id===equipId);document.getElementById('monthly-list-view').style.display='none';document.getElementById('monthly-detail-view').style.display='block';showEquipDetail(equip,'monthly-detail-content','submitMonthly');window.scrollTo(0,0);}
function showWeeklyList(){document.getElementById('weekly-list-view').style.display='block';document.getElementById('weekly-detail-view').style.display='none';}
function showWeeklyDetail(equipId){const equip=WEEKLY_CATEGORIES.find(e=>e.id===equipId);document.getElementById('weekly-list-view').style.display='none';document.getElementById('weekly-detail-view').style.display='block';showEquipDetail(equip,'weekly-detail-content','submitWeekly');window.scrollTo(0,0);}
function showVehiclesList(){document.getElementById('vehicles-list-view').style.display='block';document.getElementById('vehicles-detail-view').style.display='none';}
function showVehiclesDetail(equipId){const equip=VEHICLES.find(e=>e.id===equipId);document.getElementById('vehicles-list-view').style.display='none';document.getElementById('vehicles-detail-view').style.display='block';showEquipDetail(equip,'vehicles-detail-content','submitVehicle');window.scrollTo(0,0);}
async function submitPM(equipId,tab){const date=document.getElementById('formDate').value;const tech=document.getElementById('technician').value;if(!date||!tech){showToast('Please select date and technician',true);return;}const verifiedBy=document.getElementById(`verified-by-${equipId}`)?.value||'';const generalNotes=document.getElementById(`general-notes-${equipId}`)?.value||'';const ts=new Date().toLocaleString();const headers=['Timestamp','Date','Technician','Equipment','Task','Frequency','Result','Initials','Notes','General Notes','Verified By'];const rows=taskStates[equipId].map(t=>[ts,date,tech,equipId,t.task,t.freq,t.result,t.initials,t.notes,generalNotes,verifiedBy]);try{for(const row of rows){await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({tab,headers,row})});}showToast('✓ Submitted to Google Sheets!',false);setTimeout(()=>{if(tab==='PMMonthly')showMonthlyList();else if(tab==='PMWeekly')showWeeklyList();else showVehiclesList();},1800);}catch(err){showToast('Error — check connection',true);}}
function submitMonthly(equipId){submitPM(equipId,'PMMonthly');}
function submitWeekly(equipId){submitPM(equipId,'PMWeekly');}
function submitVehicle(equipId){submitPM(equipId,'PMVehicles');}
function showToast(msg,isError){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(isError?' error':'');setTimeout(()=>t.className='toast',3000);}
document.getElementById('formDate').value=new Date().toISOString().split('T')[0];
buildEquipList(MONTHLY_EQUIPMENT,'monthly-equip-list',showMonthlyDetail);
buildEquipList(WEEKLY_CATEGORIES,'weekly-equip-list',showWeeklyDetail);
buildEquipList(VEHICLES,'vehicles-equip-list',showVehiclesDetail);
document.querySelectorAll('.section').forEach(s=>s.style.display='none');
document.getElementById('tab-monthly').style.display='block';
</script>
</body>
</html>
